name: release

# A pushed `v*` tag is the trigger, and a caller that has just created such a
# tag can reach the same jobs through `workflow_call`. A tag pushed with the
# default `GITHUB_TOKEN` starts no workflow run of its own, so calling this
# workflow in the same run is the only way an automated tag reaches a release
# without a new credential.
on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: The `v*` tag to release. Must already exist.
        required: true
        type: string

permissions:
  contents: read

# `inputs.tag` is empty on the tag-push path, so this keys off the tag either
# way. `env` is not available in a workflow-level `concurrency`, hence the
# expression rather than the `TAG` variable the jobs use.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Builds the artifact and cuts the GitHub release. Holds no secret: the
  # marketplace credentials live only in the `release` environment, which only
  # the publish job enters.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      # The one place the trigger shape is resolved: every later step reads
      # `$TAG` and never `GITHUB_REF_NAME`, which points at the caller's branch
      # rather than the tag when this workflow is called.
      TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # A tag can point at any commit, including one no pull request ever
      # reviewed and no CI run ever saw. Requiring the tagged commit to be an
      # ancestor of main is what makes the CI workflow a real gate here,
      # without re-running the test tiers on every tag. On the called path the
      # checked-out commit is main itself, so the guard is trivially true
      # there; it stays because the tag-push path is the one it protects.
      - name: Require the tag to sit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The tag is the human-entered half and package.json the machine-read
      # half; a mismatch would publish a version nobody asked for.
      - name: Check the tag against the manifest
        id: version
        run: |
          tag_version="${TAG#v}"
          manifest_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "tag $TAG does not match package.json version $manifest_version" >&2
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      - run: npm run package

      - name: Take the release notes from the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="## [$VERSION]" '
            $0 == v { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $VERSION" >&2
            exit 1
          fi

      # A release is immutable the moment it exists, so the asset has to go up
      # in the same call that creates it - there is no second chance to attach
      # or clobber one. Re-running the same tag is still safe: a release that
      # already carries its asset is left exactly as it is.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null | grep -q '\.vsix$'; then
            echo "release $TAG already carries its asset"
          else
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md ./*.vsix
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix
          path: ./*.vsix
          if-no-files-found: error

  # Both uploads share one job so the environment review is one approval for
  # one decision: publish this build to both marketplaces.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Each upload is guarded by a query for that exact version, because a
      # marketplace rejects a re-upload of a version it already holds. Without
      # the guard, re-running a tag whose first half succeeded could never get
      # past the half that already worked.
      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Until the extension exists at all - the state the very first release
          # runs in - the query exits 0 and prints the word "undefined", so its
          # exit code answers nothing and the output has to be parsed instead.
          # Anything that is not a listing carrying this exact version counts as
          # not published, which errs toward attempting the upload: a genuinely
          # duplicate version is refused loudly by the marketplace, while a
          # skip on a bad parse would report a release that never happened.
          npx --yes @vscode/vsce@3.9.2 show smoochy.better-codebase-memory-mcp --json > listing.json || true
          published="$(node -e '
            const fs = require("fs");
            let versions = [];
            try { versions = JSON.parse(fs.readFileSync("./listing.json", "utf8")).versions || []; } catch {}
            console.log(versions.some(x => x.version === process.env.VERSION) ? "yes" : "no");
          ')"
          if [ "$published" = "yes" ]; then
            echo "$VERSION is already on the VS Code Marketplace, skipping"
          else
            npx --yes @vscode/vsce@3.9.2 publish --no-dependencies --packagePath ./*.vsix
          fi

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          status="$(curl -s -o /dev/null -w '%{http_code}' \
            "https://open-vsx.org/api/smoochy/better-codebase-memory-mcp/$VERSION")"
          if [ "$status" = "200" ]; then
            echo "$VERSION is already on Open VSX, skipping"
          else
            npx --yes ovsx@1.1.0 publish ./*.vsix --pat "$OVSX_PAT"
          fi
