blank_issues_enabled: false
contact_links:
  - name: Question about the codebase-memory-mcp CLI itself
    url: https://github.com/DeusData/codebase-memory-mcp/issues
    about: Indexing behaviour, graph contents, and what the MCP server returns come from the upstream CLI, which is separately maintained. This extension installs and operates that CLI rather than implementing it.
  - name: Report a security vulnerability
    url: https://github.com/smoochy/codebase-memory-mcp-vscode/security/advisories/new
    about: Vulnerabilities go through a private advisory, not a public issue. See SECURITY.md for what is in scope here and what belongs to the upstream CLI.
