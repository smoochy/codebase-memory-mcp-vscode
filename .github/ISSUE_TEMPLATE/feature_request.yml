name: Feature request
description: Suggest an improvement to the extension
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describing the problem before the solution helps find the right fit. Note that this extension is the operator's side of the `codebase-memory-mcp` CLI: what gets indexed and what the graph contains is the CLI's job, not this extension's.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do today that is hard, invisible, or impossible from the panel?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: A command, a setting, a panel affordance, different behaviour?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why they fall short. Optional.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This is about operating the CLI from VS Code, not about how the CLI itself indexes or answers.
          required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would be willing to open a pull request for this.
